services:
  postgres:
    image: postgres:16-alpine
    container_name: ems-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ems_db
    ports:
      - "5433:5432"
    volumes:
      - ems_pgdata:/var/lib/postgresql/data

volumes:
  ems_pgdata:
